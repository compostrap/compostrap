<!DOCTYPE html>
<!-- generated by scripts/build-demo.js from demo/ — edit demo/_layout-auth.html and demo/pages/, not this file -->
<html lang="en" data-bs-theme="light">

<head>
	<meta charset="UTF-8">
	<!-- the stored theme before the page is drawn, so a dark page does not flash light -->
	<script>
		try {
			let theme = localStorage.getItem('bootstrap-theme');
			if (theme === 'auto') {
				theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
			}
			if (theme === 'light' || theme === 'dark') {
				document.documentElement.setAttribute('data-bs-theme', theme);
			}
		} catch (e) { }
	</script>
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<link rel="icon" href="favicon.svg" type="image/svg+xml">
	<link rel="stylesheet" href="src/scss/theme.scss">
	<link rel="stylesheet" href="node_modules/bootstrap-icons/font/bootstrap-icons.css">
	<link rel="stylesheet" href="src/scss/compostrap.scss">
	<title>Password recovery – Compostrap</title>
</head>

<body class="auth-page">

<div class="auth">
	<div class="auth-top">
		<!-- the brand leads back to the demo -->
		<a class="auth-brand" href="index.html">
			<svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true">
				<circle cx="14" cy="14" r="14" fill="#ff4141"/>
				<path d="M18.02 10.63A5.25 5.25 0 1 0 18.02 17.37" fill="none" stroke="#fff" stroke-width="1.3"/>
			</svg>
			<span>Compostrap</span>
		</a>

		<button type="button" class="navbar-icon" aria-label="Toggle theme" data-tooltip="left" data-theme-switcher data-theme-light-icon="bi bi-sun" data-theme-dark-icon="bi bi-moon">
			<i data-theme-switcher-icon class="bi bi-moon" aria-hidden="true"></i>
		</button>
	</div>

	<!-- the password recovery of drago (project-auth) in its three steps: the e-mail, the code from the e-mail, the new
		password; the buttons of the demo go to the next step -->
	<div class="auth-card auth-card-split">
		<aside class="auth-visual" aria-hidden="true">
			<i class="bi bi-key"></i>
		</aside>

		<main class="auth-body">
			<div class="auth-toolbar">
				<a href="#" lang="cs">Čeština</a>
				<span class="text-body-tertiary" aria-hidden="true">&middot;</span>
				<a href="#" lang="en" class="active" aria-current="true">English</a>
			</div>

			<header class="auth-header">
				<h1 class="auth-title">Password recovery</h1>
				<p class="auth-subtitle">Follow the steps to restore access to your account.</p>
			</header>

			<!-- step 1: the e-mail -->
			<div data-recovery-step="1">
				<form class="row g-3" onsubmit="return false">
					<div class="col-12">
						<label for="rec-email" class="form-label">E-mail</label>
						<input type="email" class="form-control" id="rec-email" autocomplete="email" placeholder="jan@example.com">
					</div>
					<div class="col-12 d-grid">
						<button type="submit" class="btn btn-primary" data-recovery-next="2">Send recovery code</button>
					</div>
				</form>
			</div>

			<!-- step 2: the code from the e-mail -->
			<div data-recovery-step="2" hidden>
				<form class="row g-3" onsubmit="return false">
					<div class="col-12">
						<label for="rec-code" class="form-label">Code</label>
						<input type="text" class="form-control otp-code font-monospace fw-semibold" id="rec-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000">
					</div>
					<div class="col-12 d-grid">
						<button type="submit" class="btn btn-primary" data-recovery-next="3">Verify code</button>
					</div>
					<div class="col-12">
						<p class="mb-2">If this address is registered, we have sent a code to it:</p>
						<div class="d-flex align-items-center justify-content-between gap-3 rounded px-3 py-2 bg-body-tertiary">
							<span class="text-break">jan@example.com</span>
							<a href="#" class="flex-shrink-0" data-recovery-next="1">Change</a>
						</div>
					</div>
				</form>
			</div>

			<!-- step 3: the new password -->
			<div data-recovery-step="3" hidden>
				<form class="row g-3" onsubmit="return false">
					<div class="col-12">
						<label for="rec-password" class="form-label">New password</label>
						<input type="password" class="form-control" id="rec-password" autocomplete="new-password" aria-describedby="rec-strength">
						<!-- one growing bar instead of the segments -->
						<div class="strength-bar" data-bs-strength></div>
						<span class="strength-text" id="rec-strength" aria-live="polite"></span>
					</div>
					<div class="col-12">
						<label for="rec-verify" class="form-label">Password again</label>
						<input type="password" class="form-control" id="rec-verify" autocomplete="new-password">
					</div>
					<div class="col-12 d-grid">
						<button type="submit" class="btn btn-primary" data-recovery-next="1">Change password</button>
					</div>
				</form>
			</div>

			<div class="auth-links">
				<a href="#" data-recovery-only="2" data-recovery-next="2" hidden>Send a new code</a>
				<a href="sign-in.html">Back to sign in</a>
			</div>
		</main>
	</div>

	<footer class="auth-footer">&copy; 2026 Compostrap</footer>
</div>

<script>
	// the steps of the demo: a button shows the step it names, as the redrawn snippet does in drago
	document.addEventListener('click', (event) => {
		const next = event.target.closest('[data-recovery-next]');
		if (!next) {
			return;
		}

		event.preventDefault();
		const step = next.dataset.recoveryNext;
		document.querySelectorAll('[data-recovery-step]').forEach((el) => el.hidden = el.dataset.recoveryStep !== step);
		document.querySelectorAll('[data-recovery-only]').forEach((el) => el.hidden = el.dataset.recoveryOnly !== step);
		document.querySelector(`[data-recovery-step="${step}"] input`)?.focus();
	});
</script>

<script src="node_modules/bootstrap/dist/js/bootstrap.bundle.js"></script>
<script type="module">
	import { ThemeSwitcher, Strength } from "./src/js/index.js";

	document.addEventListener('DOMContentLoaded', () => {
		new ThemeSwitcher({ lightIcon: 'bi bi-sun', darkIcon: 'bi bi-moon' }).initialize();
		Strength.init();
	});
</script>

</body>
</html>
