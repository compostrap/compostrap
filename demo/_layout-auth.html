<!DOCTYPE html>
<!-- generated by scripts/build-demo.js from demo/ — edit demo/_layout-auth.html and demo/pages/, not this file -->
<html lang="en" data-bs-theme="light">

<head>
	<meta charset="UTF-8">
	<!-- the stored theme before the page is drawn, so a dark page does not flash light -->
	<script>
		try {
			let theme = localStorage.getItem('bootstrap-theme');
			if (theme === 'auto') {
				theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
			}
			if (theme === 'light' || theme === 'dark') {
				document.documentElement.setAttribute('data-bs-theme', theme);
			}
		} catch (e) { }
	</script>
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<link rel="icon" href="favicon.svg" type="image/svg+xml">
	<link rel="stylesheet" href="src/scss/theme.scss">
	<link rel="stylesheet" href="node_modules/bootstrap-icons/font/bootstrap-icons.css">
	<link rel="stylesheet" href="src/scss/compostrap.scss">
	<title>{{title}} – Compostrap</title>
</head>

<body class="auth-page">

<div class="auth">
	<div class="auth-top">
		<!-- the brand leads back to the demo -->
		<a class="auth-brand" href="index.html">
			<svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true">
				<circle cx="14" cy="14" r="14" fill="#ff4141"/>
				<path d="M18.02 10.63A5.25 5.25 0 1 0 18.02 17.37" fill="none" stroke="#fff" stroke-width="1.3"/>
			</svg>
			<span>Compostrap</span>
		</a>

		<div class="auth-actions">
			<button type="button" class="navbar-icon" aria-label="Toggle theme" data-tooltip="left" data-theme-switcher data-theme-light-icon="bi bi-sun" data-theme-dark-icon="bi bi-moon">
				<i data-theme-switcher-icon class="bi bi-moon" aria-hidden="true"></i>
			</button>

			<!-- language: an icon with the code of the current language, the languages in the dropdown, the current one checked -->
			<div class="dropdown">
				<button type="button" class="navbar-icon" data-bs-toggle="dropdown" aria-expanded="false" aria-label="Language">
					<i class="bi bi-translate" aria-hidden="true"></i><span class="navbar-icon-text">EN</span>
				</button>
				<ul class="dropdown-menu dropdown-menu-end">
					<li><h6 class="dropdown-header">Language</h6></li>
					<li><a class="dropdown-item d-flex align-items-center gap-3" href="#" lang="cs"><span class="me-auto">Čeština</span><span class="small text-body-secondary">CS</span><i class="bi bi-check-lg invisible" aria-hidden="true"></i></a></li>
					<li><a class="dropdown-item active d-flex align-items-center gap-3" href="#" lang="en" aria-current="true"><span class="me-auto">English</span><span class="small text-body-secondary">EN</span><i class="bi bi-check-lg" aria-hidden="true"></i></a></li>
				</ul>
			</div>
		</div>
	</div>

{{content}}

	<footer class="auth-footer">&copy; 2026 Compostrap</footer>
</div>

{{overlays}}

<script src="node_modules/bootstrap/dist/js/bootstrap.bundle.js"></script>
<script type="module">
	import { ThemeSwitcher, Strength, PasswordToggle } from "./src/js/index.js";

	document.addEventListener('DOMContentLoaded', () => {
		new ThemeSwitcher({ lightIcon: 'bi bi-sun', darkIcon: 'bi bi-moon' }).initialize();
		Strength.init();
		PasswordToggle.init();
	});
</script>

</body>
</html>
