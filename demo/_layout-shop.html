<!DOCTYPE html>
<!-- generated by scripts/build-demo.js from demo/ — edit demo/_layout-shop.html and demo/pages/, not this file -->
<html lang="en" data-bs-theme="light">

<head>
	<meta charset="UTF-8">
	<!-- the stored theme before the page is drawn, so a dark page does not flash light -->
	<script>
		try {
			let theme = localStorage.getItem('bootstrap-theme');
			if (theme === 'auto') {
				theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
			}
			if (theme === 'light' || theme === 'dark') {
				document.documentElement.setAttribute('data-bs-theme', theme);
			}
		} catch (e) { }
	</script>
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<link rel="icon" href="favicon.svg" type="image/svg+xml">
	<link rel="stylesheet" href="src/scss/theme.scss">
	<link rel="stylesheet" href="node_modules/bootstrap-icons/font/bootstrap-icons.css">
	<link rel="stylesheet" href="src/scss/compostrap.scss">
	<title>{{title}} – Compostrap</title>
</head>

<body class="shop-page">

<!-- the storefront: the header with the brand, links, theme switch and the mini cart, no sidebar -->
<header class="shop-header">
	<div class="container">
		<a class="shop-brand" href="shop-products.html">
			<svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true">
				<circle cx="14" cy="14" r="14" fill="#ff4141"/>
				<path d="M18.02 10.63A5.25 5.25 0 1 0 18.02 17.37" fill="none" stroke="#fff" stroke-width="1.3"/>
			</svg>
			<span>Compostrap Shop</span>
		</a>

		<ul class="shop-nav">
			<li><a href="shop-products.html">Products</a></li>
			<li><a href="index.html">Back to the demo</a></li>
		</ul>

		<button type="button" class="navbar-icon" aria-label="Toggle theme" data-tooltip="bottom" data-theme-switcher data-theme-light-icon="bi bi-sun" data-theme-dark-icon="bi bi-moon">
			<i data-theme-switcher-icon class="bi bi-moon" aria-hidden="true"></i>
		</button>

		<a class="shop-minicart" href="shop-cart.html" aria-label="Go to shopping cart. Number of items: 2, total price: $1,399">
			<span class="shop-minicart-icon">
				<i class="bi bi-cart3" aria-hidden="true"></i>
				<span class="badge badge-sm theme-danger rounded-pill" aria-live="polite">2</span>
			</span>
			<span>$1,399</span>
		</a>
	</div>
</header>

{{hero}}

<main class="container">
{{content}}
</main>

<footer class="shop-footer">
	<div class="container">&copy; 2026 Compostrap Shop</div>
</footer>

{{overlays}}

<script src="node_modules/bootstrap/dist/js/bootstrap.bundle.js"></script>
<script type="module">
	import { ThemeSwitcher, NumberInput } from "./src/js/index.js";

	document.addEventListener('DOMContentLoaded', () => {
		new ThemeSwitcher({ lightIcon: 'bi bi-sun', darkIcon: 'bi bi-moon' }).initialize();
		NumberInput.init();
	});
</script>

</body>
</html>
