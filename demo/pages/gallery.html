			<!-- the gallery like in the drago administration: copy mode, upload and the tiles of the images -->
			<div class="content-box mb-3">
				<header class="mb-4 pb-2 border-bottom d-flex flex-wrap justify-content-between align-items-end gap-3">
					<div>
						<h1 class="h5 mb-1">Gallery</h1>
						<p class="small text-body-secondary mb-0">Upload images and copy them into the texts.</p>
					</div>
					<div class="d-flex flex-wrap align-items-center gap-2">
						<span class="small text-body-secondary">Copy as</span>
						<span class="btn-group btn-group-sm btn-group-segmented" role="group" aria-label="Copy as">
						<input type="radio" class="btn-check" name="demo-copy-mode" id="demo-copy-texy" autocomplete="off" checked>
						<label class="btn btn-outline-secondary" for="demo-copy-texy">Texy</label>
						<input type="radio" class="btn-check" name="demo-copy-mode" id="demo-copy-path" autocomplete="off">
						<label class="btn btn-outline-secondary" for="demo-copy-path">Path</label>
						</span>
					</div>
				</header>

				<!-- the upload as a dropzone; in the administration data-dropzone-submit sends the form at once -->
				<form class="mb-4" onsubmit="return false">
					<label class="dropzone">
						<input type="file" name="images[]" class="dropzone-input" multiple accept="image/jpeg,image/png,image/gif,image/webp" aria-label="Images">
						<i class="bi bi-cloud-arrow-up dropzone-icon" aria-hidden="true"></i>
						<span class="dropzone-title">Drop images here or <span class="dropzone-link">choose them</span></span>
						<span class="dropzone-hint">JPEG, PNG, GIF or WebP, at most 8 MB each.</span>
						<span class="dropzone-files" data-dropzone-files></span>
					</label>
				</form>
