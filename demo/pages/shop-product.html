<!-- overlays -->
<script>
	// the demo of the variants and the photos; the real shop does it by its Naja integration
	document.querySelectorAll('.shop-variant-options').forEach((group) => group.addEventListener('click', (event) => {
		const pill = event.target.closest('.shop-variant-pill:not(:disabled)');
		if (pill) {
			group.querySelectorAll('.shop-variant-pill').forEach((p) => p.classList.toggle('active', p === pill));
		}
	}));
	document.querySelector('.shop-detail-thumbs').addEventListener('click', (event) => {
		const thumb = event.target.closest('.shop-detail-thumb');
		if (thumb) {
			document.querySelector('[data-gallery-main]').src = thumb.dataset.galleryImage;
			document.querySelectorAll('.shop-detail-thumb').forEach((t) => {
				t.classList.toggle('active', t === thumb);
				t.setAttribute('aria-pressed', String(t === thumb));
			});
		}
	});
</script>
